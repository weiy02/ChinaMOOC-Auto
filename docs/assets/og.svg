<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.0" r="0.7">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#06060c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <rect x="80" y="88" width="56" height="56" rx="16" fill="url(#brand)"/>
    <text x="108" y="128" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">慕</text>

    <text x="80" y="234" font-size="52" font-weight="700" fill="#f2f4ff" letter-spacing="-2">中国大学 MOOC 自动化脚本</text>
    <rect x="80" y="266" width="430" height="10" rx="5" fill="url(#brand)" opacity="0.9"/>

    <text x="80" y="336" font-size="28" fill="#a9b0cc">互评 · 讨论 · 随堂测验 · 整章自动学习</text>
    <text x="80" y="382" font-size="24" fill="#6f7899">Tampermonkey / 脚本猫通用 · 自动适配 MOOC 与 SPOC</text>

    <g transform="translate(80, 430)">
      <rect width="220" height="54" rx="13" fill="url(#brand)"/>
      <text x="110" y="35" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">一键安装</text>
      <rect x="240" y="0" width="212" height="54" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="346" y="35" text-anchor="middle" font-size="22" fill="#f2f4ff">Greasy Fork</text>
    </g>

    <text x="80" y="556" font-size="20" fill="#545d7a">weiy02.github.io/ChinaMOOC-Auto · MIT License</text>
  </g>

  <!-- 右侧玻璃面板示意 -->
  <g transform="translate(822, 138)">
    <rect x="-1" y="-1" width="342" height="374" rx="21" fill="none" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="2"/>
    <rect width="340" height="372" rx="20" fill="#0a0a14" fill-opacity="0.92"/>

    <circle cx="26" cy="28" r="5" fill="url(#brand)"/>
    <text x="42" y="34" font-family="PingFang SC, sans-serif" font-size="15" fill="#eef0ff">MOOC 自动化</text>
    <line x1="0" y1="54" x2="340" y2="54" stroke="#ffffff" stroke-opacity="0.07"/>

    <g font-family="PingFang SC, sans-serif" font-size="14" fill="#6f7899">
      <text x="28" y="84" fill="#ffffff">学习</text>
      <text x="94" y="84">互评</text>
      <text x="160" y="84">讨论</text>
      <text x="226" y="84">日志</text>
      <text x="288" y="84">设置</text>
    </g>
    <rect x="20" y="94" width="34" height="3" rx="1.5" fill="url(#brand)"/>

    <rect x="20" y="114" width="300" height="42" rx="10" fill="#8b5cf6" fill-opacity="0.24" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="36" y="141" font-family="PingFang SC, sans-serif" font-size="14" fill="#e6e2ff">开始自动学习（当前章）</text>

    <rect x="20" y="166" width="300" height="42" rx="10" fill="#8b5cf6" fill-opacity="0.24" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="36" y="193" font-family="PingFang SC, sans-serif" font-size="14" fill="#e6e2ff">随堂测验：一键完成并提交</text>

    <rect x="20" y="218" width="300" height="42" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="36" y="245" font-family="PingFang SC, sans-serif" font-size="14" fill="#a9b0cc">页面 DOM 诊断</text>

    <line x1="0" y1="286" x2="340" y2="286" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="24" y="320" font-family="PingFang SC, sans-serif" font-size="13" fill="#6f7899">运行中：第 2 节 · 随堂测验</text>
    <rect x="256" y="300" width="60" height="27" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="286" y="319" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#a9b0cc">停止</text>
  </g>
</svg>
